name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Build
    runs-on: ubuntu-latest
    env:
      SIMPLEOTA_API_TOKEN: ${{ secrets.SIMPLEOTA_API_TOKEN }}
      SIMPLEOTA_CHIP: ${{ vars.SIMPLEOTA_CHIP }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check firmware version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^set(PROJECT_VER "\(.*\)")$/\1/p' CMakeLists.txt)"
          if [[ -z "${app_version}" ]]; then
            echo "PROJECT_VER was not found in CMakeLists.txt."
            exit 1
          fi
          if [[ "${tag}" != "${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match PROJECT_VER ${app_version}."
            exit 1
          fi
          echo "label=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Write release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIMPLEOTA_WIFI_SSID: ${{ secrets.SIMPLEOTA_WIFI_SSID }}
          SIMPLEOTA_WIFI_PASSWORD: ${{ secrets.SIMPLEOTA_WIFI_PASSWORD }}
          SIMPLEOTA_DEVICE_TOKEN: ${{ secrets.SIMPLEOTA_DEVICE_TOKEN }}
        run: ./scripts/secrets.sh write

      - name: Compile
        id: compile
        env:
          SIMPLEOTA_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            -e SIMPLEOTA_CHIP \
            -e SIMPLEOTA_RELEASE \
            -e IDF_GIT_SAFE_DIR=/project \
            espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2 \
            ./scripts/build.sh
          echo "chip=$(<"${GITHUB_WORKSPACE}/build/chip")" >> "${GITHUB_OUTPUT}"

      - name: Skip rollout when the project token is missing
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN == ''
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### SimpleOTA upload skipped

          The SIMPLEOTA_API_TOKEN secret is not set. This tag built the firmware and did not upload it or start a rollout.
          EOF

      - name: Skip rollout when the project id is missing
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN != '' && vars.SIMPLEOTA_PROJECT_ID == ''
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### SimpleOTA upload skipped

          SIMPLEOTA_API_TOKEN is set, but the SIMPLEOTA_PROJECT_ID repository variable is empty. The release action requires both, so nothing was uploaded.
          EOF

      - name: Upload and start rollout
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN != '' && vars.SIMPLEOTA_PROJECT_ID != ''
        uses: xanderwasserman/simpleOTA-actions@v1.0.3
        with:
          api-token: ${{ secrets.SIMPLEOTA_API_TOKEN }}
          project-id: ${{ vars.SIMPLEOTA_PROJECT_ID }}
          binary: build/simpleota_starter.bin
          version-label: ${{ steps.version.outputs.label }}
          chip-family: ${{ steps.compile.outputs.chip }}
          framework: esp_idf
